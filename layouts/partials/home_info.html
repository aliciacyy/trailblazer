{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
  <header class="entry-header">
    <h1>{{ .Title | markdownify }}</h1>
  </header>
  <div class="entry-content">{{ .Content | markdownify }}</div>
	<!-- <div class="stat-box">Hello???</div> -->
  <div class="dashboard">
    <div class="stat-card">
      <h2>Total Runs</h2>
      <p class="stat-box-no-decimal" id="total-runs" data-target="3">0</p>
    </div>
    <div class="stat-card">
      <h2>Total Distance</h2>
			<p class="stat">
				<span class="stat-number" id="total-distance" data-target="24.27">0</span>
				<span>km</span>
			</p>
    </div>
    <div class="stat-card">
      <h2>Last Run Date</h2>
      <p class="stat">2024-12-04</p>
    </div>
    <div class="stat-card">
      <h2>Average Speed</h2>
			<p class="stat">
				<span class="stat-number" data-target="7.29">0</span>
				<span>min/km</span>
			</p>
    </div>
  </div>
  <footer class="entry-footer">
    {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
  </footer>
</article>

{{- end -}}
