{{- with site.Params.homeInfoParams }}
<article class="first-entry home-info">
  <header class="entry-header">
    <h1>{{ .Title | markdownify }}</h1>
  </header>
  <div class="entry-content">{{ .Content | markdownify }}</div>
	<!-- <div class="stat-box">Hello???</div> -->
  <div class="dashboard">
    <div class="stat-card">
      <h3>Total # of Runs</h3>
      <p class="stat-box-no-decimal" id="total-runs" data-target="34">0</p>
    </div>
    <div class="stat-card">
      <h3>Total Distance</h3>
			<p class="stat">
				<span class="stat-number" id="total-distance" data-target="210.57">0</span>
				<span>km</span>
			</p>
    </div>
    <div class="stat-card">
      <h3>Average Pace</h3>
      <p class="stat">
        <span class="stat-box-no-decimal" id="average-pace-minutes" data-target="7">0</span><span>:</span><span class="stat-box-no-decimal" id="average-pace-seconds" data-target="26">0</span>
        <span>min/km</span>
      </p>
    </div>
    <div class="stat-card">
      <h3>Total Time Running</h3>
			<p class="stat">
				<span class="stat-box-no-decimal" id="hours" data-target="25">0</span><span>:</span><span class="stat-box-no-decimal" id="minutes" data-target="34">0</span><span>:</span><span class="stat-box-no-decimal" id="seconds" data-target="43">0</span>
			</p>
    </div>
  </div>
  <footer class="entry-footer">
    {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
  </footer>
</article>

{{- end -}}
